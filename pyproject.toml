[build-system]
build-backend = "setuptools.build_meta"
requires = [ "setuptools>=77.0.3" ]

[project]
name = "numpy-flint-arb"
version = "1.5.4"
description = "Arbitrary precision ball arithmetic (interval arithmetic) dtype in NumPy"
readme = "README.md"
license = "MIT"
authors = [
  { name = "34j" },
]
requires-python = ">=3.12"
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries",
]
dependencies = [
  "cm-time>=0.1.2",
  "numpy>=2.2.6",
  "python-flint>=0.6",
  "types-array-api>=1.3.0",
]
urls."Bug Tracker" = "https://github.com/34j/numpy-flint-arb/issues"
urls.Changelog = "https://github.com/34j/numpy-flint-arb/blob/main/CHANGELOG.md"
urls.documentation = "https://numpy-flint-arb.readthedocs.io"
urls.repository = "https://github.com/34j/numpy-flint-arb"

[dependency-groups]
dev = [
  "coverage",
  "hypothesis>=6.151.9",
  "ndindex>=1.10.1",
  "packaging-34j[test]",
  "pytest-env>=1.2",
  "pytest-json-report>=1.5",
  "ty",
]
docs = [
  "packaging-34j[docs]",
]

[tool.ruff]
extend = ".venv/ruff.toml"
lint.extend-per-file-ignores."src/numpy_flint_arb/_main.py" = [
  "A002",
  "ARG001",
  "ARG005",
  "C901",
  "D205",
  "DOC501",
  "FURB118",
  "FURB189",
  "N801",
  "N807",
  "NPY002",
  "PLR6104",
  "PLW0108",
  "PLW0603",
  "PLW3201",
  "SLF001",
]

[tool.pyproject-fmt]
max_supported_python = "3.14"

[tool.ty]
terminal.error-on-warning = true
