[build-system]
build-backend = "setuptools.build_meta"
requires = [ "setuptools>=77.0.3" ]

[project]
name = "numpy-flint-arb"
version = "1.5.3"
description = "Arbitrary precision ball arithmetic (interval arithmetic) dtype in NumPy"
readme = "README.md"
license = "MIT"
authors = [
  { name = "34j" },
]
requires-python = ">=3.12"
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries",
]
dependencies = [
  "cm-time>=0.1.2",
  "numpy>=2.2.6",
  "python-flint>=0.6",
  "types-array-api>=1.2",
]
urls."Bug Tracker" = "https://github.com/34j/numpy-flint-arb/issues"
urls.Changelog = "https://github.com/34j/numpy-flint-arb/blob/main/CHANGELOG.md"
urls.documentation = "https://numpy-flint-arb.readthedocs.io"
urls.repository = "https://github.com/34j/numpy-flint-arb"

[dependency-groups]
dev = [
  "coverage",
  "hypothesis>=6.151.9",
  "ndindex>=1.10.1",
  "packaging-34j[test]",
  "pytest-env>=1.2",
  "pytest-json-report>=1.5",
]
docs = [
  "packaging-34j[docs]",
]

[tool.ruff]
extend = ".venv/ruff.toml"
lint.extend-per-file-ignores."src/numpy_flint_arb/_main.py" = [
  "A002",
  "ARG001",
  "ARG005",
  "C901",
  "D205",
  "DOC501",
  "FURB118",
  "FURB189",
  "N801",
  "N807",
  "NPY002",
  "PLR6104",
  "PLW0108",
  "PLW0603",
  "PLW3201",
  "SLF001",
]

[tool.pyproject-fmt]
max_supported_python = "3.14"

[tool.ty]
terminal.error-on-warning = true

[tool.pytest]
addopts = [
  "-v",
  "-Wonce",
  "-p no:doctest",
  "--cov=numpy_flint_arb",
  "--cov-report=term",
  "--cov-report=xml",
]
minversion = "9.0"
pythonpath = [ "src" ]

[tool.pytest_env]
ARRAY_API_TESTS_MODULE = "numpy_flint_arb.np"
ARRAY_API_TESTS_SKIP_DTYPES = "float32,complex64,uint16,uint32,uint64,int8,int16,int32,int64"

[tool.coverage]
run.branch = true
paths.source = [
  "src",
  ".tox/**/site-packages",
]
report.exclude_lines = [
  "@overload",
  'if __name__ == "__main__":',
  "if TYPE_CHECKING",
  "pragma: no cover",
  "raise NotImplementedError",
]

[tool.semantic_release]
version_variables = [
  "src/numpy_flint_arb/__init__.py:__version__",
  "docs/conf.py:release",
]
version_toml = [ "pyproject.toml:project.version" ]
build_command = """
pip install uv
uv lock
git add uv.lock
uv build
"""
branches.main.match = "main"
branches.noop.match = "(?!main$)"
branches.noop.prerelease = true
changelog.environment.keep_trailing_newline = true
changelog.exclude_commit_patterns = [
  "chore(?:\\([^)]*?\\))?: .+",
  "ci(?:\\([^)]*?\\))?: .+",
  "refactor(?:\\([^)]*?\\))?: .+",
  "style(?:\\([^)]*?\\))?: .+",
  "test(?:\\([^)]*?\\))?: .+",
  "build\\((?!deps\\): .+)",
  "Merged? .*",
  "Initial [Cc]ommit.*",           # codespell:ignore
]
